{% extends "base.html" %}
{% block title %}Activity Logs{% endblock %}
{% block content %}
<h4 class="fw-bold mb-3">Activity Logs</h4>
<div class="card p-3">
<table class="table table-sm">
  <thead><tr><th>Time</th><th>User</th><th>Action</th><th>IP</th></tr></thead>
  <tbody>
  {% for l in logs %}
    <tr><td>{{ l.timestamp.strftime('%Y-%m-%d %H:%M:%S') }}</td><td>{{ l.user.username if l.user else 'System' }}</td><td>{{ l.action }}</td><td>{{ l.ip_address }}</td></tr>
  {% endfor %}
  </tbody>
</table>
</div>
{% endblock %}
