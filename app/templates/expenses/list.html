{% extends "base.html" %}
{% block title %}Expenses{% endblock %}
{% block content %}
<h4 class="fw-bold mb-3">Expenses <span class="text-muted small">Total: ₱{{ '%.2f'|format(total) }}</span></h4>
<div class="card p-3 mb-3">
<form method="POST" action="{{ url_for('expenses.add_expense') }}" class="row g-2">
  <div class="col-md-2"><select name="category" class="form-select">{% for c in categories %}<option>{{ c }}</option>{% endfor %}</select></div>
  <div class="col-md-3"><input type="text" name="description" class="form-control" placeholder="Description"></div>
  <div class="col-md-2"><input type="number" step="0.01" name="amount" class="form-control" placeholder="Amount" required></div>
  <div class="col-md-2"><input type="date" name="date" class="form-control" required></div>
  <div class="col-md-3"><button class="btn btn-sv w-100">Add Expense</button></div>
</form>
</div>
<div class="card p-3">
<div class="table-responsive">
<table class="table table-sm">
  <thead><tr><th>Date</th><th>Category</th><th>Description</th><th>Amount</th><th></th></tr></thead>
  <tbody>
  {% for e in items %}
    <tr><td>{{ e.date }}</td><td>{{ e.category }}</td><td>{{ e.description }}</td><td>₱{{ '%.2f'|format(e.amount) }}</td>
      <td><form method="POST" action="{{ url_for('expenses.delete_expense', id=e.id) }}"><button class="btn btn-sm btn-outline-danger">Delete</button></form></td>
    </tr>
  {% endfor %}
  </tbody>
</table>
</div>
</div>
{% endblock %}
