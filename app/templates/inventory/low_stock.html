{% extends "base.html" %}
{% block title %}Low Stock{% endblock %}
{% block content %}
<h4 class="fw-bold mb-3">Low Stock Alerts</h4>
<div class="card p-3">
<table class="table table-sm">
  <thead><tr><th>Item</th><th>Quantity</th><th>Threshold</th></tr></thead>
  <tbody>
  {% for i in items %}
    <tr class="table-danger"><td>{{ i.name }}</td><td>{{ i.quantity }} {{ i.unit }}</td><td>{{ i.low_stock_threshold }}</td></tr>
  {% else %}
    <tr><td colspan="3" class="text-muted">No low stock items.</td></tr>
  {% endfor %}
  </tbody>
</table>
</div>
{% endblock %}
